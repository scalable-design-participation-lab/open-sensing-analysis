[project]
name = "open-sensing-analysis"
version = "0.1.0"
description = "Sensor calibration and spatial interpolation for open environmental sensing data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core data / geospatial
    "pandas>=2.0",
    "numpy>=1.24",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    # Visualisation
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "cmcrameri>=1.7",
    # Statistics / ML
    "scipy>=1.11",
    "scikit-learn>=1.3",
    # Satellite layer extraction
    "planetary-computer>=1.0",
    "pystac-client>=0.7",
    "stackstac>=0.5",
    "rasterio>=1.3",
    # HTTP / data retrieval
    "requests>=2.31",
    # Utilities
    "tqdm>=4.66",
    "pillow>=10.0",
    "earthengine-api>=1.7.32",
    "rasterstats>=0.21.0",
    "openpyxl>=3.1.5",
    "xgboost>=3.2.0",
    "pyarrow>=24.0.0",
    "momepy>=0.11.0",
    "mapclassify>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
